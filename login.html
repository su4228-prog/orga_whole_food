<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>로그인 | ORGA Whole Foods</title>
  <link rel="stylesheet" href="./css/reset.css?v=20261020" />
  <link rel="stylesheet" href="./css/login.css?v=20261103c" />
</head>

<body>
  <main class="auth-page">
    <div class="auth-box">
      <a class="auth-logo" href="index.html" aria-label="메인으로">
        <img src="./img/login/pulmuone-shop.svg" alt="Pulmuone" width="162" height="28" />
      </a>
      <h1 class="auth-title">안녕하세요. #풀무원 입니다.</h1>
      <p class="auth-sub">원활한 서비스를 위해 로그인 후 이용해 주세요.</p>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="field">
          <input id="loginId" name="login_id" type="text" autocomplete="username" maxlength="20"
                 placeholder="아이디를 입력해 주세요." aria-label="아이디" required />
        </div>
        <div class="field">
          <input id="loginPw" name="password" type="password" autocomplete="current-password" maxlength="64"
                 placeholder="비밀번호를 입력해 주세요." aria-label="비밀번호" required />
          <button type="button" class="eye" data-eye="loginPw" aria-label="비밀번호 보기" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5z" fill="currentColor"/><circle cx="12" cy="12" r="3.6" fill="#fff"/></svg>
          </button>
        </div>
        <p class="form-msg" id="loginMsg" role="alert"></p>
        <button type="submit" class="btn-login" id="loginBtn">로그인</button>
        <div class="auth-row">
          <label class="check"><input type="checkbox" id="saveId" /> 아이디 저장</label>
          <div class="find-links">
            <button type="button" data-soon="아이디 찾기">아이디 찾기</button>
            <span aria-hidden="true"></span>
            <button type="button" data-soon="비밀번호 찾기">비밀번호 찾기</button>
          </div>
        </div>
      </form>

      <section class="easy" aria-labelledby="easyTitle">
        <h2 class="easy-title" id="easyTitle">간편 가입 및 로그인</h2>
        <div class="easy-buttons">
          <p class="bubble">
            <svg class="gift" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5" fill="#6fae31"/><rect x="2" y="6.5" width="20" height="4" rx="1" fill="#82c341"/><rect x="11" y="6.5" width="2" height="14.5" fill="#fff"/><path d="M12 6.5C10 3 7 3.4 7 5.2S10 6.5 12 6.5zm0 0c2-3.5 5-3.1 5-1.3S14 6.5 12 6.5z" fill="none" stroke="#6fae31" stroke-width="1.4"/><text x="12" y="18.5" font-size="7" font-weight="700" text-anchor="middle" fill="#fff">#</text></svg>
            신규 회원가입 시 <b>최대 5천원 할인쿠폰 2종</b> 증정!
          </p>
          <button type="button" class="btn-easy btn-kakao" data-soon="카카오 간편 로그인">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4C6.8 4 3 7.2 3 11.1c0 2.5 1.6 4.6 4 5.9l-.9 3.4c-.1.3.3.6.6.4l4-2.6c.4 0 .9.1 1.3.1 5.2 0 9-3.2 9-7.2S17.2 4 12 4z" fill="#191919"/></svg>
            카카오로 계속하기
          </button>
          <button type="button" class="btn-easy btn-naver" data-soon="네이버 간편 로그인">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.6 12.5 9.1 4.5H4.5v15h4.9v-8l5.5 8h4.6v-15h-4.9z" fill="#fff"/></svg>
            네이버로 계속하기
          </button>
          <a class="btn-easy btn-join" href="signup.html">일반 회원가입</a>
        </div>
        <p class="easy-msg" id="easyMsg" role="status"></p>
      </section>
    </div>
  </main>

  <script type="module" src="./js/login.js?v=20261104"></script>
</body>

</html>
