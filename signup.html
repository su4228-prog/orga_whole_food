<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>회원가입 | ORGA Whole Foods</title>
  <link rel="stylesheet" href="./css/reset.css?v=20261020" />
  <link rel="stylesheet" href="./css/login.css?v=20261103c" />
</head>

<body>
  <main class="auth-page signup">
    <div class="auth-box">
      <a class="auth-logo" href="index.html" aria-label="메인으로">
        <img src="./img/login/pulmuone-shop.svg" alt="Pulmuone" width="162" height="28" />
      </a>
      <h1 class="auth-title">일반 회원가입</h1>
      <p class="auth-sub">아이디와 비밀번호로 간단하게 가입해요.</p>

      <form class="auth-form" id="signupForm" novalidate>
        <div>
          <label class="label" for="suId">아이디 <em>*</em></label>
          <div class="with-btn">
            <div class="field">
              <input id="suId" type="text" autocomplete="username" maxlength="20" placeholder="영문 소문자 · 숫자 4~20자" required />
            </div>
            <button type="button" class="btn-sub" id="checkIdBtn">중복 확인</button>
          </div>
          <p class="hint" id="idHint">영문 소문자와 숫자로 4~20자</p>
        </div>

        <div>
          <label class="label" for="suPw">비밀번호 <em>*</em></label>
          <div class="field">
            <input id="suPw" type="password" autocomplete="new-password" maxlength="64" placeholder="영문 + 숫자 8자 이상" required />
            <button type="button" class="eye" data-eye="suPw" aria-label="비밀번호 보기" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5z" fill="currentColor"/><circle cx="12" cy="12" r="3.6" fill="#fff"/></svg>
            </button>
          </div>
          <p class="hint" id="pwHint">영문과 숫자를 섞어 8자 이상 (아이디는 넣을 수 없어요)</p>
        </div>

        <div>
          <label class="label" for="suPw2">비밀번호 확인 <em>*</em></label>
          <div class="field">
            <input id="suPw2" type="password" autocomplete="new-password" maxlength="64" placeholder="비밀번호를 한 번 더 입력해 주세요." required />
          </div>
          <p class="hint" id="pw2Hint"></p>
        </div>

        <div>
          <label class="label" for="suName">이름 <em>*</em></label>
          <div class="field">
            <input id="suName" type="text" autocomplete="name" maxlength="20" placeholder="이름을 입력해 주세요." required />
          </div>
        </div>

        <div class="agree">
          <label class="check all"><input type="checkbox" id="agreeAll" /> 전체 동의</label>
          <label class="check"><input type="checkbox" class="agree-item" required /> [필수] 이용약관 동의</label>
          <label class="check"><input type="checkbox" class="agree-item" required /> [필수] 개인정보 수집 · 이용 동의</label>
        </div>

        <p class="form-msg" id="signupMsg" role="alert"></p>
        <button type="submit" class="btn-login" id="signupBtn">가입하기</button>
      </form>
      <p class="back-link">이미 회원이신가요? <a href="login.html">로그인</a></p>
    </div>
  </main>

  <script type="module" src="./js/signup.js?v=20261104"></script>
</body>

</html>
